# Builds the image from source. The deployment bundle (build-bundle.sh) ships
# its own docker-compose.yml that only copies a prebuilt binary.
services:
  cirrus-license:
    image: cirrus-license:latest
    build:
      context: .
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
    container_name: cirrus-license
    ports:
      - "127.0.0.1:8790:8080"
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
