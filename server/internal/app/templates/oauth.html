{{define "title"}}{{.T "oauth.title"}}{{end}}
{{define "content"}}
<article class="doc">
<h1 id="oauth-title">{{.T "oauth.returning"}}</h1>
<p id="oauth-hint">{{.T "oauth.hint"}}</p>
<p id="oauth-error" class="error" hidden></p>
<p><a id="oauth-open" class="btn primary" href="#">{{.T "oauth.open"}}</a></p>
<p class="muted">{{.T "oauth.keeps"}}</p>
<p class="muted" id="oauth-missing" hidden>{{.T "oauth.missing"}}</p>
</article>
{{end}}
{{define "scripts"}}<script src="{{asset "oauth.js"}}"></script>{{end}}
