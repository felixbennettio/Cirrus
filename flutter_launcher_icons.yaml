# Regenerate platform icons with: dart run flutter_launcher_icons
# Sources live in assets/branding/*.svg (render with `rsvg-convert -w 1024 -h 1024`).
flutter_launcher_icons:
  android: "ic_launcher"
  image_path_android: "assets/branding/cirrus.png"
  adaptive_icon_background: "assets/branding/cirrus_background.png"
  adaptive_icon_foreground: "assets/branding/cirrus_foreground.png"
  adaptive_icon_monochrome: "assets/branding/cirrus_monochrome.png"
  min_sdk_android: 24
  ios: true
  image_path_ios: "assets/branding/cirrus_full.png"
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/branding/cirrus.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/branding/cirrus_macos.png"
