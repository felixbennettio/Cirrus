# Reusable workflow: builds Cirrus for every platform and uploads the
# installers as workflow artifacts (one artifact per platform).
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version name, e.g. 1.0.0
        type: string
        required: true
      build_number:
        description: Monotonic build number
        type: string
        required: true
      apple:
        description: Build macOS and iOS (macOS runners are billed at a higher rate)
        type: boolean
        default: true
      refresh_catalog:
        description: Regenerate the API catalog from the latest Cloudflare OpenAPI schema
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Refresh API catalog
        if: inputs.refresh_catalog
        run: dart run tool/build_catalog.dart || echo "::warning::Catalog refresh failed; using the bundled catalog"
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF
            echo "Using release keystore from secrets"
          else
            MSG="ANDROID_KEYSTORE_BASE64 is not set; APKs are signed with a debug key"
            # Only worth an annotation on release builds; CI builds are throwaway.
            case "${{ inputs.version }}" in
              0.0.0-ci.*) echo "$MSG" ;;
              *) echo "::warning::$MSG" ;;
            esac
          fi
      - name: Build APKs and App Bundle
        run: |
          ARGS="--release --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }}"
          flutter build apk $ARGS --split-per-abi
          flutter build apk $ARGS
          flutter build appbundle $ARGS
      - name: Collect
        run: |
          V=${{ inputs.version }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   dist/Cirrus-$V-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Cirrus-$V-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      dist/Cirrus-$V-android-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk             dist/Cirrus-$V-android-universal.apk
          cp build/app/outputs/bundle/release/app-release.aab          dist/Cirrus-$V-android.aab
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libstdc++-12-dev librsvg2-bin file
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Refresh API catalog
        if: inputs.refresh_catalog
        run: dart run tool/build_catalog.dart || echo "::warning::Catalog refresh failed; using the bundled catalog"
      - run: flutter build linux --release --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }}
      - run: scripts/package_linux.sh ${{ inputs.version }} dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Refresh API catalog
        if: inputs.refresh_catalog
        shell: bash
        run: dart run tool/build_catalog.dart || echo "::warning::Catalog refresh failed; using the bundled catalog"
      - run: flutter build windows --release --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }}
      - name: Bundle the MSVC runtime
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$dll" $release -ErrorAction Stop
          }
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\Cirrus-$v-windows-x64-portable.zip"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=$v "/DSourceDir=$PWD\build\windows\x64\runner\Release" "/DOutputDir=$PWD\dist" windows\installer\cirrus.iss
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS
    if: inputs.apple
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Refresh API catalog
        if: inputs.refresh_catalog
        run: dart run tool/build_catalog.dart || echo "::warning::Catalog refresh failed; using the bundled catalog"
      - run: flutter build macos --release --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }}
      - name: Package DMG and zip
        run: |
          V=${{ inputs.version }}
          APP="build/macos/Build/Products/Release/Cirrus.app"
          mkdir -p dist dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Cirrus $V" -srcfolder dmg -ov -format UDZO "dist/Cirrus-$V-macos-universal.dmg"
          ditto -c -k --keepParent "$APP" "dist/Cirrus-$V-macos-universal.zip"
          lipo -info "$APP/Contents/MacOS/Cirrus" || true
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS
    if: inputs.apple
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Refresh API catalog
        if: inputs.refresh_catalog
        run: dart run tool/build_catalog.dart || echo "::warning::Catalog refresh failed; using the bundled catalog"
      - run: flutter build ios --release --no-codesign --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }}
      - name: Package unsigned IPA
        run: |
          V=${{ inputs.version }}
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "dist/Cirrus-$V-ios-unsigned.ipa" Payload
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/*
          if-no-files-found: error
