name: Release

on:
  push:
    tags: ['v*']
    # Temporary: lets a commit marked [release] on this branch publish (tag pushes are unavailable here).
    branches: ['claude/admiring-pascal-son4gl']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create/publish, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = tag ]; then TAG="${{ github.ref_name }}"; fi
          if [ -z "$TAG" ]; then TAG="v$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: meta
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.meta.outputs.version }}
      build_number: ${{ github.run_number }}
      apple: true
      refresh_catalog: true

  publish:
    name: Publish release
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        run: |
          NOTES="docs/release-notes/${{ needs.meta.outputs.tag }}.md"
          if [ -f "$NOTES" ]; then cp "$NOTES" notes.md; else echo "Cirrus ${{ needs.meta.outputs.tag }}" > notes.md; fi
          {
            echo
            echo '### Checksums (SHA-256)'
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Cirrus ${{ needs.meta.outputs.tag }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
