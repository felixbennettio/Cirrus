name: CI

on:
  push:
    branches: [main, 'claude/**']
    tags-ignore: ['v*']
    # The native Apple app has its own workflow (apple.yml).
    paths-ignore: ['apple/**', '.forgejo/workflows/apple.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      apple:
        description: Also build macOS and iOS
        type: boolean
        default: true
      store_build:
        description: Paid builds (licence keys on Windows, Linux and the Android APKs; Play Billing in the AAB)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: false  # the runners come with Flutter; there is no cache server
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test

  build:
    name: Build
    needs: check
    uses: ./.forgejo/workflows/build.yml
    secrets: inherit
    with:
      version: 0.0.0-ci.${{ github.run_number }}
      build_number: ${{ github.run_number }}
      # Every Apple job boots a fresh macOS VM, so run the Apple builds on
      # demand, on pull requests, or when a commit says "[apple]".
      apple: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.apple) || contains(github.event.head_commit.message, '[apple]') }}
      store_build: ${{ github.event_name == 'workflow_dispatch' && inputs.store_build }}
