name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create/publish, e.g. v1.0.0
        required: true

permissions:
  contents: write

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - id: v
        # Build numbers (Android version codes) must keep growing; the run
        # counter restarted at 1 when the repository moved to Forgejo.
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "build=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: meta
    uses: ./.forgejo/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.meta.outputs.version }}
      build_number: ${{ needs.meta.outputs.build }}
      apple: true
      refresh_catalog: true

  publish:
    name: Publish release
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        run: |
          NOTES="docs/release-notes/${{ needs.meta.outputs.tag }}.md"
          if [ -f "$NOTES" ]; then cp "$NOTES" notes.md; else echo "Cirrus ${{ needs.meta.outputs.tag }}" > notes.md; fi
          {
            echo
            echo '### Checksums (SHA-256)'
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> notes.md
      - uses: https://data.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.meta.outputs.tag }}
          sha: ${{ github.sha }}
          title: Cirrus ${{ needs.meta.outputs.tag }}
          release-notes-file: notes.md
          release-dir: dist
