# Reusable workflow: builds Cirrus for every platform and uploads the
# installers as workflow artifacts (one artifact per platform).
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version name, e.g. 1.0.0
        type: string
        required: true
      build_number:
        description: Monotonic build number
        type: string
        required: true
      apple:
        description: Build macOS and iOS (each job boots a fresh macOS VM first)
        type: boolean
        default: true
      refresh_catalog:
        description: Regenerate the API catalog from the latest Cloudflare OpenAPI schema
        type: boolean
        default: false
      store_build:
        description: Paid builds (Cirrus Pro enforced) - App Store and Google Play use in-app purchase, Windows, Linux and the Android APKs use licence keys
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # JDK 17 and the Android SDK come with the runner's image.
      - uses: https://github.com/subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false  # the runners come with Flutter; there is no cache server
      - run: flutter pub get
      - name: Build configuration
        # Public OAuth client ID and scopes from repository variables (empty
        # values build without the built-in client), and the store channel.
        shell: bash
        env:
          CLIENT_ID: ${{ vars.CIRRUS_OAUTH_CLIENT_ID }}
          SCOPES: ${{ vars.CIRRUS_OAUTH_SCOPES }}
          STORE_BUILD: ${{ inputs.store_build }}
        # Store builds: the APKs unlock Pro with a licence key, the App Bundle
        # (Google Play) with Play Billing.
        run: |
          defines() {
            jq -n --arg id "$CLIENT_ID" --arg scopes "$SCOPES" --arg store "$1" \
              '{CIRRUS_OAUTH_CLIENT_ID: $id, CIRRUS_OAUTH_SCOPES: $scopes, CIRRUS_STORE: $store}'
          }
          if [ "$STORE_BUILD" = true ]; then
            defines license > dart_defines.json
            defines play > dart_defines_play.json
          else
            defines '' > dart_defines.json
            cp dart_defines.json dart_defines_play.json
          fi
      - name: Refresh API catalog
        if: inputs.refresh_catalog
        run: dart run tool/build_catalog.dart || echo "::warning::Catalog refresh failed; using the bundled catalog"
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF
            echo "Using release keystore from secrets"
          else
            MSG="ANDROID_KEYSTORE_BASE64 is not set; APKs are signed with a debug key"
            # Only worth an annotation on release builds; CI builds are throwaway.
            case "${{ inputs.version }}" in
              0.0.0-ci.*) echo "$MSG" ;;
              *) echo "::warning::$MSG" ;;
            esac
          fi
      - name: Build APKs and App Bundle
        run: |
          ARGS="--release --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }}"
          # Stop the Gradle and Kotlin daemons between builds: left running,
          # they pile up until the runner runs out of memory and is shut down.
          stop_daemons() { pkill -f org.gradle.launcher.daemon || true; pkill -f KotlinCompileDaemon || true; sleep 2; }
          flutter build apk $ARGS --dart-define-from-file=dart_defines.json --split-per-abi
          stop_daemons
          flutter build apk $ARGS --dart-define-from-file=dart_defines.json
          stop_daemons
          flutter build appbundle $ARGS --dart-define-from-file=dart_defines_play.json
      - name: Collect
        run: |
          V=${{ inputs.version }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   dist/Cirrus-$V-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Cirrus-$V-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      dist/Cirrus-$V-android-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk             dist/Cirrus-$V-android-universal.apk
          cp build/app/outputs/bundle/release/app-release.aab          dist/Cirrus-$V-android.aab
          ls -la dist
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The GTK and packaging tools come with the runner's image (Ubuntu 22.04,
      # which keeps the glibc requirement low).
      - uses: https://github.com/subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false  # the runners come with Flutter; there is no cache server
      - run: flutter pub get
      - name: Build configuration
        # Public OAuth client ID and scopes from repository variables (empty
        # values build without the built-in client), and the store channel.
        shell: bash
        env:
          CLIENT_ID: ${{ vars.CIRRUS_OAUTH_CLIENT_ID }}
          SCOPES: ${{ vars.CIRRUS_OAUTH_SCOPES }}
          STORE: ${{ inputs.store_build && 'license' || '' }}
        run: >
          jq -n --arg id "$CLIENT_ID" --arg scopes "$SCOPES" --arg store "$STORE"
          '{CIRRUS_OAUTH_CLIENT_ID: $id, CIRRUS_OAUTH_SCOPES: $scopes, CIRRUS_STORE: $store}' > dart_defines.json
      - name: Refresh API catalog
        if: inputs.refresh_catalog
        run: dart run tool/build_catalog.dart || echo "::warning::Catalog refresh failed; using the bundled catalog"
      - run: flutter build linux --release --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }} --dart-define-from-file=dart_defines.json
      - run: scripts/package_linux.sh ${{ inputs.version }} dist
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false  # the runners come with Flutter; there is no cache server
      - run: flutter pub get
      - name: Build configuration
        # Public OAuth client ID and scopes from repository variables (empty
        # values build without the built-in client), and the store channel.
        shell: bash
        env:
          CLIENT_ID: ${{ vars.CIRRUS_OAUTH_CLIENT_ID }}
          SCOPES: ${{ vars.CIRRUS_OAUTH_SCOPES }}
          STORE: ${{ inputs.store_build && 'license' || '' }}
        run: >
          jq -n --arg id "$CLIENT_ID" --arg scopes "$SCOPES" --arg store "$STORE"
          '{CIRRUS_OAUTH_CLIENT_ID: $id, CIRRUS_OAUTH_SCOPES: $scopes, CIRRUS_STORE: $store}' > dart_defines.json
      - name: Refresh API catalog
        if: inputs.refresh_catalog
        shell: bash
        run: dart run tool/build_catalog.dart || echo "::warning::Catalog refresh failed; using the bundled catalog"
      - run: flutter build windows --release --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }} --dart-define-from-file=dart_defines.json
      - name: Bundle the MSVC runtime
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$dll" $release -ErrorAction Stop
          }
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\Cirrus-$v-windows-x64-portable.zip"
          # Inno Setup 6 is on the runner's PATH.
          iscc /DAppVersion=$v "/DSourceDir=$PWD\build\windows\x64\runner\Release" "/DOutputDir=$PWD\dist" windows\installer\cirrus.iss
          Get-ChildItem dist
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS
    if: inputs.apple
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false  # the runners come with Flutter; there is no cache server
      - run: flutter pub get
      - name: Build configuration
        # Public OAuth client ID and scopes from repository variables (empty
        # values build without the built-in client), and the store channel.
        shell: bash
        env:
          CLIENT_ID: ${{ vars.CIRRUS_OAUTH_CLIENT_ID }}
          SCOPES: ${{ vars.CIRRUS_OAUTH_SCOPES }}
          STORE: ${{ inputs.store_build && 'appstore' || '' }}
        run: >
          jq -n --arg id "$CLIENT_ID" --arg scopes "$SCOPES" --arg store "$STORE"
          '{CIRRUS_OAUTH_CLIENT_ID: $id, CIRRUS_OAUTH_SCOPES: $scopes, CIRRUS_STORE: $store}' > dart_defines.json
      - name: Refresh API catalog
        if: inputs.refresh_catalog
        run: dart run tool/build_catalog.dart || echo "::warning::Catalog refresh failed; using the bundled catalog"
      - run: flutter build macos --release --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }} --dart-define-from-file=dart_defines.json
      - name: Package DMG and zip
        run: |
          V=${{ inputs.version }}
          APP="build/macos/Build/Products/Release/Cirrus.app"
          mkdir -p dist dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Cirrus $V" -srcfolder dmg -ov -format UDZO "dist/Cirrus-$V-macos-universal.dmg"
          ditto -c -k --keepParent "$APP" "dist/Cirrus-$V-macos-universal.zip"
          lipo -info "$APP/Contents/MacOS/Cirrus" || true
          ls -la dist
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS
    if: inputs.apple
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false  # the runners come with Flutter; there is no cache server
      - run: flutter pub get
      - name: Build configuration
        # Public OAuth client ID and scopes from repository variables (empty
        # values build without the built-in client), and the store channel.
        shell: bash
        env:
          CLIENT_ID: ${{ vars.CIRRUS_OAUTH_CLIENT_ID }}
          SCOPES: ${{ vars.CIRRUS_OAUTH_SCOPES }}
          STORE: ${{ inputs.store_build && 'appstore' || '' }}
        run: >
          jq -n --arg id "$CLIENT_ID" --arg scopes "$SCOPES" --arg store "$STORE"
          '{CIRRUS_OAUTH_CLIENT_ID: $id, CIRRUS_OAUTH_SCOPES: $scopes, CIRRUS_STORE: $store}' > dart_defines.json
      - name: Refresh API catalog
        if: inputs.refresh_catalog
        run: dart run tool/build_catalog.dart || echo "::warning::Catalog refresh failed; using the bundled catalog"
      - run: flutter build ios --release --no-codesign --build-name=${{ inputs.version }} --build-number=${{ inputs.build_number }} --dart-define-from-file=dart_defines.json
      - name: Package unsigned IPA
        run: |
          V=${{ inputs.version }}
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "dist/Cirrus-$V-ios-unsigned.ipa" Payload
          ls -la dist
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: ios
          path: dist/*
          if-no-files-found: error
