<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#FFC24B"/>
   <stop offset="1" stop-color="#F2541B"/>
 </linearGradient>
 <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
   <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#9C2F05" flood-opacity="0.30"/>
 </filter>
 <filter id="osh" x="-20%" y="-20%" width="140%" height="140%">
   <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
 </filter>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
</svg>
